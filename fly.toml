[app]
name = "finanzasapp"
primary_region = "scl"       # Santiago, Chile — más cercano

[build]
  [build.args]
    NODE_VERSION = "20"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/gastos.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # no cold starts
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  size = "shared-cpu-1x"       # gratis en free tier
  memory = "256mb"

[[mounts]]
  source = "finanzasapp_data"
  destination = "/data"        # SQLite persiste aquí
